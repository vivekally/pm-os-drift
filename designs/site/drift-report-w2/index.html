<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved · PM OS Weekly Drift Report</title>
<link rel="canonical" href="../">
<meta http-equiv="refresh" content="0; url=../">
<style>
  :root{--bg:#070A11; --surface:#0F1420; --border:#1E2D45; --accent:#3DDC84; --text:#E2E8F0; --muted:#64748B;
        --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:var(--bg); color:var(--text); font:400 15px/1.6 var(--ui); padding:24px}
  .box{max-width:440px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:32px}
  p{color:var(--muted); margin:0 0 24px}
  a{display:inline-block; font:600 13px/1 var(--ui); padding:11px 16px; border-radius:5px;
    background:var(--accent); color:#052112; text-decoration:none}
  .k{font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
</style>
</head>
<body>
  <div class="box">
    <p class="k">Moved</p>
    <p>This report is now the default view. Redirecting you there — if nothing happens, use the link below.</p>
    <a href="../">Open the current report</a>
  </div>
</body>
</html>
